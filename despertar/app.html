<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DESPERTAR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="DESPERTAR: tarefas, sessões de foco e modo compromisso para parar de procrastinar.">
<meta name="theme-color" content="#0B0B14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: um ecrã de celular — topo com sequência, vista ativa a rolar, separadores em baixo; a sessão de foco ocupa o ecrã inteiro. */
:root {
  --bg: #0B0B14;
  --surface: #13131F;
  --surface-2: #1C1C2C;
  --fg: #F1F0F7;
  --muted: #9C9AB2;
  --line: #29293D;
  --primary: #4C8DFF;
  --primary-soft: rgba(76, 141, 255, .14);
  --primary-ink: #06122B;
  --violet: #8B6CFF;
  --fire: #FF7A2F;
  --fire-soft: rgba(255, 122, 47, .14);
  --ok: #3DD68C;
  --bad: #FF5D61;
  --font-display: "Big Shoulders", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 16px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F5F5FA; --surface: #FFFFFF; --surface-2: #ECECF4; --fg: #14131F; --muted: #5C5A70; --line: #DCDBE7;
    --primary: #2F6FE4; --primary-soft: rgba(47, 111, 228, .1); --primary-ink: #FFFFFF; --violet: #6A4FE0;
    --fire: #D9530F; --fire-soft: rgba(217, 83, 15, .1); --ok: #1C8A55; --bad: #CC2E33; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F5F5FA; --surface: #FFFFFF; --surface-2: #ECECF4; --fg: #14131F; --muted: #5C5A70; --line: #DCDBE7;
  --primary: #2F6FE4; --primary-soft: rgba(47, 111, 228, .1); --primary-ink: #FFFFFF; --violet: #6A4FE0;
  --fire: #D9530F; --fire-soft: rgba(217, 83, 15, .1); --ok: #1C8A55; --bad: #CC2E33; color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font-body); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; max-width: 560px; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Topo */
.top { display: flex; align-items: center; gap: 10px; padding-block: calc(env(safe-area-inset-top, 0px) + 12px) 8px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: .06em; margin-right: auto; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--primary), var(--violet)); color: #fff; }
.logo-mark svg { width: 17px; height: 17px; fill: currentColor; stroke: none; }
.chip-fire { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 11px; background: var(--fire-soft); color: var(--fire); font-family: var(--font-mono); font-weight: 500; font-size: 14px; border: 0; }
.chip-fire svg { width: 16px; height: 16px; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }

main { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-block: 6px 96px; }
.view { display: grid; gap: 16px; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
h3 { margin: 0; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.hello h1 { margin: 0; font-size: 22px; font-weight: 700; }
.hello p { margin: 0; color: var(--muted); font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; }

/* Nível */
.level { display: grid; gap: 8px; }
.level-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.level-n { font-family: var(--font-display); font-weight: 900; font-size: 24px; letter-spacing: .04em; }
.level-xp { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--violet)); transition: width .5s; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tiles.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.tile .v { font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .k { font-size: 12px; color: var(--muted); line-height: 1.3; }
.tile .v.fire { color: var(--fire); }

/* Próxima tarefa */
.next {
  position: relative; overflow: hidden; border-radius: 20px; padding: 18px; display: grid; gap: 12px;
  background: radial-gradient(120% 140% at 100% 0%, rgba(139, 108, 255, .28), transparent 60%), linear-gradient(160deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
}
.next-title { font-size: 22px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--muted); max-width: 100%; }
.tag svg { width: 13px; height: 13px; }

.btn { border: 1px solid transparent; border-radius: 14px; padding: 12px 16px; font-weight: 700; background: var(--surface-2); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.go { background: linear-gradient(135deg, var(--primary), var(--violet)); color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 20px; letter-spacing: .08em; padding: 14px 18px; }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.solid-danger { background: var(--bad); color: #fff; }
.btn.small { padding: 8px 12px; font-size: 14px; border-radius: 11px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > input { flex: 1 1 160px; min-width: 0; }

/* Lista de tarefas */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.task { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 4px; }
.task-main { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 4px 10px; display: grid; gap: 3px; }
.task-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task.done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.play { width: 42px; height: 42px; border-radius: 12px; border: 0; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.play svg { fill: currentColor; width: 16px; height: 16px; }
.check { width: 28px; height: 28px; margin: 0 6px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; flex: none; }
.check svg { width: 16px; height: 16px; stroke-width: 3; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; }
.chip b { font-family: var(--font-mono); font-weight: 500; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.chip[aria-pressed="true"] b { color: inherit; }

.empty { text-align: center; padding: 24px 16px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty svg { width: 34px; height: 34px; color: var(--primary); }
.empty strong { color: var(--fg); }

/* Metas */
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; }
.goal-head { display: flex; align-items: center; gap: 10px; }
.goal-head h3 { flex: 1; min-width: 0; font-size: 18px; overflow-wrap: anywhere; }
.goal-count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.goal.complete { border-color: var(--ok); }
.goal .list .task { background: var(--bg); }

/* Progresso */
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 6px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.chart .g { stroke: var(--line); }
.chart .b { fill: var(--primary); }
.chart .b.today { fill: var(--violet); }
.ach { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; }
.badge .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.badge.on .ic { background: var(--fire-soft); color: var(--fire); }
.badge strong { display: block; font-size: 14px; line-height: 1.2; }
.badge span { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
.badge:not(.on) strong { color: var(--muted); }
.hist .item { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 14px; }
.hist .t { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.hist .d { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; border: 1px solid currentColor; }
.pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.xp { color: var(--primary); }

/* Lembretes */
.rem { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 10px 4px; }
.rem-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; border: 0; background: none; text-align: left; padding: 4px 10px; }
.rem-time { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.rem.off .rem-time, .rem.off .rem-label { color: var(--muted); }
.rem-meta { display: grid; gap: 3px; min-width: 0; }
.rem-label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.days { display: flex; gap: 3px; font-family: var(--font-mono); font-size: 11px; }
.days span { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.days span.on { background: var(--primary-soft); color: var(--primary); }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); pointer-events: none; transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch input:checked + span { background: var(--primary); border-color: var(--primary); }
.switch input:checked + span::after { transform: translateX(20px); background: var(--primary-ink); }
.switch input:focus-visible + span { outline: 3px solid var(--primary); outline-offset: 2px; }
.note { border-left: 3px solid var(--fire); padding: 2px 0 2px 12px; color: var(--muted); font-size: 14px; margin: 0; }

/* Separadores */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-block: 6px calc(env(safe-area-inset-bottom, 0px) + 6px); }
.tab { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 12px; color: var(--muted); border-radius: 10px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--primary); font-weight: 700; }
.fab { position: fixed; right: max(18px, calc((100vw - 560px) / 2 + 18px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); width: 58px; height: 58px; border-radius: 18px; border: 0; background: linear-gradient(135deg, var(--primary), var(--violet)); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 26px rgba(76, 141, 255, .35); z-index: 5; }
.fab svg { width: 26px; height: 26px; stroke-width: 2.4; }

/* Folhas */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(4, 4, 10, .6); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 18px); display: grid; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); } to { transform: none; } }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 2px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.close { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
input[type="text"], input[type="number"], input[type="time"], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 12px; }
textarea { min-height: 96px; font-family: var(--font-mono); font-size: 13px; resize: vertical; }
input[type="range"] { width: 100%; accent-color: var(--primary); }
.big-input { font-size: 20px; font-weight: 600; }
.time-input { font-family: var(--font-display); font-weight: 800; font-size: 56px; text-align: center; padding: 6px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle-row > span:first-child { min-width: 0; }
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daypick button { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-weight: 700; }
.daypick button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.confirm { border: 1px solid var(--bad); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.confirm p { margin: 0; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions > :first-child { grid-column: 1 / -1; }
.commit-box { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 6px; background: var(--bg); }
.commit-box ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.lang-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.lang-pick .chip { text-align: center; padding: 9px 6px; }

/* Sessão */
.session {
  position: fixed; inset: 0; z-index: 40; overflow-y: auto; color: #F1F0F7;
  background: radial-gradient(90% 60% at 50% 0%, rgba(76, 141, 255, .22), transparent 70%), radial-gradient(70% 50% at 50% 100%, rgba(139, 108, 255, .2), transparent 70%), #08080F;
  display: grid; grid-template-rows: auto 1fr auto;
}
.s-top { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; padding-block: calc(env(safe-area-inset-top, 0px) + 18px) 0; }
.s-pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 5px 12px; font-size: 12px; letter-spacing: .12em; font-weight: 700; background: rgba(76, 141, 255, .16); color: #9BBEFF; }
.s-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #4C8DFF; animation: blink 1.6s infinite; }
.s-pill.lock { background: rgba(255, 122, 47, .15); color: #FFB085; letter-spacing: .04em; }
.s-pill.lock svg { width: 13px; height: 13px; }
.s-pill.paused { background: rgba(255, 255, 255, .1); color: #CFCDE0; }
@keyframes blink { 50% { opacity: .3; } }
.s-body { display: grid; gap: 14px; justify-items: center; align-content: center; text-align: center; padding-block: 16px; }
.s-label { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #9C9AB2; margin: 0; }
.s-title { margin: 0; font-size: clamp(22px, 6vw, 30px); font-weight: 700; line-height: 1.2; max-width: 24ch; overflow-wrap: anywhere; }
.ringbox { position: relative; width: min(290px, 74vw); aspect-ratio: 1; max-width: 100%; }
.ringbox svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ringbox .track { stroke: rgba(255, 255, 255, .08); }
.ringbox .prog { stroke: url(#ringgrad); transition: stroke-dashoffset 1s linear; }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; gap: 2px; }
.count { font-family: var(--font-display); font-weight: 900; font-size: clamp(64px, 20vw, 96px); line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.count-sub { font-family: var(--font-mono); font-size: 13px; color: #9C9AB2; }
.s-msg { margin: 0; color: #CFCDE0; font-size: 16px; min-height: 1.5em; max-width: 32ch; }
.s-progress { width: min(340px, 100%); display: grid; gap: 6px; }
.s-progress .row2 { display: flex; justify-content: space-between; font-size: 13px; color: #9C9AB2; }
.s-progress .bar { background: rgba(255, 255, 255, .08); }
.s-exits { margin: 0; font-size: 14px; color: #FFB085; }
.s-actions { display: grid; gap: 10px; padding-block: 8px calc(env(safe-area-inset-bottom, 0px) + 20px); width: 100%; max-width: 560px; margin: 0 auto; }
.s-actions .btn.go { font-size: 22px; padding: 16px; border-radius: 18px; }
.s-actions .btn.go:disabled { background: rgba(255, 255, 255, .1); color: #CFCDE0; opacity: 1; font-size: 18px; letter-spacing: .04em; }
.s-sec { display: flex; gap: 8px; }
.s-sec .btn { flex: 1; background: rgba(255, 255, 255, .07); color: #F1F0F7; border-color: rgba(255, 255, 255, .12); }
.giveup { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.giveup .fill { position: absolute; inset: 0; background: rgba(255, 93, 97, .35); transform-origin: left; transform: scaleX(0); }
.giveup span { position: relative; }
.s-confirm { border: 1px solid rgba(255, 93, 97, .5); border-radius: 14px; padding: 12px; display: grid; gap: 10px; text-align: left; background: rgba(255, 93, 97, .08); }
.s-confirm p { margin: 0; }
.s-confirm .btn.ghost { color: #F1F0F7; border-color: rgba(255, 255, 255, .25); }
.s-banner { background: rgba(255, 122, 47, .16); color: #FFD2B8; border-radius: 12px; padding: 10px 12px; font-size: 14px; }

/* Concluído e lembrete */
.done-ov, .remind { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; background: rgba(4, 4, 10, .8); padding: 20px; }
.remind { z-index: 50; }
.done-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 24px 20px; display: grid; gap: 14px; text-align: center; animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { from { transform: scale(.94); } to { transform: none; } }
.done-check { width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #fff; }
.done-check svg { width: 38px; height: 38px; stroke-width: 3; }
.done-card h2 { font-size: 36px; }
.xp-big { font-family: var(--font-display); font-weight: 900; font-size: 44px; line-height: 1; background: linear-gradient(90deg, var(--primary), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.new-ach { display: grid; gap: 6px; text-align: left; }
.remind .done-card { border-color: var(--fire); }
.bell { width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: var(--fire-soft); color: var(--fire); animation: ring 1.2s ease-in-out infinite; }
.bell svg { width: 32px; height: 32px; }
@keyframes ring { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-6deg); } }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 70; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.sound-banner { display: flex; align-items: center; gap: 10px; width: 100%; border: 1px dashed var(--fire); background: var(--fire-soft); border-radius: 14px; padding: 10px 12px; text-align: left; font-size: 14px; color: var(--fg); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

      <div id="done-wrap" class="view" hidden>

    <!-- PROGRESSO -->

        <div class="tile"><span class="v" id="p-done">0</span><span class="k" data-i18n="progress.done"></span></div>
        <div class="tile"><span class="v" id="p-hours">0</span><span class="k" data-i18n="progress.hours"></span></div>

  </main>

  <nav class="tabs" role="tablist">

    <p class="s-label" data-i18n="session.current"></p>

    }
  });
  window.addEventListener("beforeunload", (e) => { const s = state.runtime.session; if (s && s.commitment) { e.preventDefault(); e.returnValue = ""; } });

  // concluído
  let doneNextId = null;
  function showDone(r) {
    $("done-task").textContent = r.title;
    $("done-xp").textContent = "+" + r.xp + " XP";
    $("done-focus").textContent = t("done.focus", { m: Math.round(r.focusSeconds / 60) }) + (r.after.lv.level > r.before.lv.level ? " · " + t("done.levelUp", { n: r.after.lv.level }) : "");
    $("done-lv").textContent = t("level", { n: r.after.lv.level });
    $("done-lvxp").textContent = r.after.lv.xp + " / " + r.after.lv.need + " XP";
    $("done-bar").style.width = Math.round((r.after.lv.xp / r.after.lv.need) * 100) + "%";
    const A = t("ach");
    $("done-ach").innerHTML = r.newAch.map((id) => { const ic = ACH.find((a) => a[0] === id)[1]; return '<div class="badge on"><span class="ic"><svg class="i"><use href="#' + ic + '"/></svg></span><div><strong>' + esc(t("done.newAch")) + ": " + esc(A[id][0]) + "</strong><span>" + esc(A[id][1]) + "</span></div></div>"; }).join("");
    const next = state.tasks.find((x) => x.status === "pending"); doneNextId = next ? next.id : null;
    $("done-next").hidden = !next;
    $("done").hidden = false; (next ? $("done-next") : $("done-close")).focus();
  }
  $("done-close").addEventListener("click", () => { $("done").hidden = true; });
  $("done-next").addEventListener("click", () => { $("done").hidden = true; if (doneNextId) openStart(doneNextId); });

  // ---------------- Lembrete a tocar ----------------
  let showingRem = null;
  function showReminder(a) {
    showingRem = a;
    $("rm-task").textContent = remLabel(a);
    $("rm-time").textContent = a.time + (a.days.length ? " · " + daysSummary(a.days) : "");
    const task = a.taskId && state.tasks.find((x) => x.id === a.taskId && x.status === "pending");
    $("rm-start").hidden = !task;
    $("remind").hidden = false; chime(2); notify(t("remind.title"), remLabel(a));
  }
  $("rm-start").addEventListener("click", () => { const a = showingRem; $("remind").hidden = true; showingRem = null; if (a && a.taskId) openStart(a.taskId); });
  $("rm-dismiss").addEventListener("click", () => { $("remind").hidden = true; showingRem = null; });
  $("rm-snooze").addEventListener("click", () => {
    const a = showingRem; $("remind").hidden = true; showingRem = null; if (!a) return;
    const until = Date.now() + 10 * 60000; state.runtime.snooze = { alarm: a, until }; save();
    toast(t("remind.snoozed", { t: hhmm(new Date(until)) }));
  });

  // ---------------- Ajustes e backup ----------------
  $("btn-settings").addEventListener("click", () => {
    $("set-name").value = state.name; $("set-commit").checked = state.settings.commitment; $("set-sound").checked = state.settings.sound; $("set-volume").value = state.settings.volume;
    $("import-confirm").hidden = true; $("paste-box").hidden = true; $("wipe-confirm").hidden = true;
    applyStatic(); openSheet("settings-sheet");
  });
  $("streak-chip").addEventListener("click", () => show("progress"));
  $("lang-pick").addEventListener("click", (e) => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });
  $("set-name").addEventListener("change", (e) => { state.name = e.target.value.trim().slice(0, 40); save(); renderAll(); });
  $("set-commit").addEventListener("change", (e) => { state.settings.commitment = e.target.checked; save(); });
  $("set-sound").addEventListener("change", (e) => { state.settings.sound = e.target.checked; save(); updateSoundBanner(); });
  $("set-volume").addEventListener("change", (e) => { state.settings.volume = Number(e.target.value); save(); chime(1); });

  function backupText() {
    return JSON.stringify({ name: state.name, alarms: state.alarms, history: state.history, tasks: state.tasks, goals: state.goals, settings: state.settings, app: "DESPERTAR", version: 2, exportedAt: new Date().toISOString() }, null, 2);
  }
  $("btn-export").addEventListener("click", () => {
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([backupText()], { type: "application/json" })); a.download = "despertar-backup.json";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast(t("backup.created"));
    } catch (e) { toast(t("backup.readErr")); }
  });
  $("btn-copy").addEventListener("click", () => {
    const txt = backupText();
    const fallback = () => { $("paste-box").hidden = false; $("paste-area").value = txt; $("paste-area").select(); toast(t("backup.selected")); };
    try { navigator.clipboard.writeText(txt).then(() => toast(t("backup.copied")), fallback); } catch (e) { fallback(); }
  });
  $("btn-paste").addEventListener("click", () => { $("paste-box").hidden = !$("paste-box").hidden; if (!$("paste-box").hidden) $("paste-area").focus(); });
  let pending = null;
  function prepareImport(text) {
    let d; try { d = JSON.parse(text); } catch (e) { toast(t("backup.invalid")); return; }
    if (!d || typeof d !== "object" || Array.isArray(d) || !["name", "alarms", "history", "tasks", "goals"].some((k) => k in d)) { toast(t("backup.notOurs")); return; }
    const arr = (v, fn) => (Array.isArray(v) ? v : []).map(fn).filter(Boolean);
    pending = { name: str(d.name, 40), tasks: arr(d.tasks, normTask), goals: arr(d.goals, normGoal), alarms: arr(d.alarms, normAlarm), history: arr(d.history, normHist), settings: d.settings };
    $("import-summary").textContent = t("backup.summary", { tasks: t("n.tasks", { n: pending.tasks.length }), goals: t("n.goals", { n: pending.goals.length }), alarms: t("n.alarms", { n: pending.alarms.length }), history: t("n.history", { n: pending.history.length }) });
    $("import-confirm").hidden = false;
  }
  $("import-file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => prepareImport(String(r.result)); r.onerror = () => toast(t("backup.readErr")); r.readAsText(f); e.target.value = "";
  });
  $("btn-paste-read").addEventListener("click", () => prepareImport($("paste-area").value));
  $("btn-import-no").addEventListener("click", () => { pending = null; $("import-confirm").hidden = true; });
  $("btn-import-yes").addEventListener("click", () => {
    if (!pending) return;
    const s = blank(); Object.assign(s, { name: pending.name, tasks: pending.tasks, goals: pending.goals, alarms: pending.alarms, history: pending.history });
    if (pending.settings) s.settings = normSettings(pending.settings);
    state = s; pending = null; save(); closeSheets(); renderAll(); toast(t("backup.done"));
  });
  $("btn-wipe").addEventListener("click", () => { $("wipe-confirm").hidden = false; });
  $("btn-wipe-no").addEventListener("click", () => { $("wipe-confirm").hidden = true; });
  $("btn-wipe-yes").addEventListener("click", () => { state = blank(); save(); closeSheets(); renderAll(); toast(t("wipe.done")); });

  // ---------------- Navegação ----------------
  let view = "today";
  function show(v) {
    view = v;
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === v)));
    ["today", "goals", "progress", "reminders"].forEach((x) => { $("view-" + x).hidden = x !== v; });
    $("fab").hidden = !["today", "goals"].includes(v);
    $("fab").setAttribute("aria-label", t(v === "goals" ? "goals.new" : "task.new"));
    document.querySelector("main").scrollTop = 0;
  }
  document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) show(b.dataset.view); });
  $("fab").addEventListener("click", () => (view === "goals" ? openGoal(null) : openTask(null)));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!$("done").hidden) $("done").hidden = true; else closeSheets(); } });

  function renderAll() { const s = stats(); renderToday(s); renderGoals(); renderProgress(s); renderReminders(); updateSoundBanner(); if (state.runtime.session && !$("session").hidden) renderSession(); }

  // ---------------- Ciclo ----------------
  function tick() {
    const now = new Date();
    if (state.runtime.session && !$("session").hidden) renderSession();
    if (showingRem) return;
    const sn = state.runtime.snooze;
    if (sn && now.getTime() >= sn.until) { state.runtime.snooze = null; save(); const a = normAlarm(sn.alarm); if (a && now.getTime() - sn.until < CATCH_UP) showReminder(a); return; }
    for (const a of state.alarms) {
      if (!a.enabled) continue;
      const [h, m] = a.time.split(":").map(Number), occ = new Date(now); occ.setHours(h, m, 0, 0);
      const diff = now - occ; if (diff < 0 || diff > CATCH_UP) continue;
      if (a.days.length && !a.days.includes(occ.getDay())) continue;
      const k = a.id + "@" + dayKey(occ) + "T" + a.time; if (state.runtime.fired[k]) continue;
      state.runtime.fired[k] = Date.now();
      const lim = Date.now() - 2 * 86400e3; for (const [kk, v] of Object.entries(state.runtime.fired)) if (v < lim) delete state.runtime.fired[kk];
      if (!a.days.length) a.enabled = false;
      save(); renderReminders();
      if (state.runtime.session) { chime(1); notify(t("remind.title"), remLabel(a)); } else showReminder(a);
      break;
    }
  }

  // ---------------- Arranque ----------------
  applyStatic();
  const hash = location.hash.slice(1); show(["today", "goals", "progress", "reminders"].includes(hash) ? hash : "today");
  renderAll(); save();
  if (state.runtime.session) showSession();
  setInterval(tick, 1000); tick();
  if ("serviceWorker" in navigator && location.protocol === "https:") { try { navigator.serviceWorker.register("sw.js").then((r) => { swReg = r; }, () => {}); } catch (e) {} }
})();
</script>
</body>
</html>
