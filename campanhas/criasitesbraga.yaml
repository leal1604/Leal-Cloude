# Campanhas de Pesquisa — Cria Sites Braga (criasitesbraga.com)
# Conta em Portugal: valores em EUROS, fuso de Lisboa.
# Com 50 €/mês, começamos só por Portugal; o Brasil está em criasitesbraga-brasil.yaml
# para quando o orçamento aumentar (junte as campanhas num só arquivo nessa altura).
# Uso: python skills/google-ads-manager/scripts/gads.py -c campanhas/criasitesbraga.yaml validate

account:
  customer_id: "000-000-0000"     # A PREENCHER: ID da nova conta (topo do Google Ads)
  currency: EUR
  timezone: Europe/Lisbon

budget:
  monthly_limit: 50.00            # máximo absoluto por mês, em euros
  safety_margin: 0.10
  pause_at: 0.98
  overspend_factor: 2.0
  min_daily: 1.00
  rebalance_threshold: 0.05
  auto_resume_next_month: true
  scope: account
  pause_unmanaged: true           # conta nova: no limite, pausa TUDO (inclusive a campanha do assistente do Google)

campaigns:
  # ---------------- PORTUGAL (PT-PT) ----------------
  - name: "PT | Pesquisa | Criação de Sites"
    weight: 1
    bidding:
      strategy: MAXIMIZE_CLICKS
      max_cpc: 1.50
    locations: [2620]             # Portugal
    languages: [1014]             # Português
    negative_keywords: &negativas
      - grátis
      - gratis
      - gratuito
      - curso
      - aula
      - tutorial
      - emprego
      - vaga
      - vagas
      - estágio
      - salário
      - template
      - download
      - pdf
      - '"como criar"'
      - '"como fazer"'
      - '"o que é"'
    stop_rules:
      max_daily_spend: 4.00
    ad_groups:
      - name: "PT - Criação de Sites"
        keywords:
          - "[criação de sites]"
          - '"criação de sites braga"'
          - '"criação de sites"'
          - '"empresa de criação de sites"'
          - '"web design braga"'
          - '"fazer site para empresa"'
          - '"site profissional"'
          - '"criar site para empresa"'
          - '"desenvolvimento de sites"'
          - '"orçamento site"'
        ads:
          - final_url: https://criasitesbraga.com
            path1: sites
            path2: braga
            headlines:
              - Criação de Sites em Braga
              - Sites Profissionais Rápidos
              - Sites para Empresas
              - Peça o Seu Orçamento Hoje
              - Site Pronto para Telemóvel
              - Design Moderno e Otimizado
              - Atendimento Personalizado
              - Mais Clientes com o Seu Site
              - Otimizado para o Google
              - Landing Pages que Convertem
            descriptions:
              - Criamos o site da sua empresa com design moderno, rápido e pronto para o telemóvel.
              - Sites e landing pages pensados para gerar contactos. Peça o seu orçamento sem compromisso.
              - Empresa em Braga com atendimento em todo o país. Fale connosco e comece o seu projeto.
              - Do design à publicação, tratamos de tudo para a sua empresa estar online com qualidade.
      - name: "PT - Landing Pages"
        keywords:
          - "[landing page]"
          - '"criação de landing page"'
          - '"landing page para empresa"'
          - '"página de vendas"'
          - '"criar landing page"'
          - '"landing page profissional"'
        ads:
          - final_url: https://criasitesbraga.com
            path1: landing-page
            headlines:
              - Criação de Landing Pages
              - Landing Pages que Convertem
              - Páginas de Vendas Eficazes
              - Peça o Seu Orçamento Hoje
              - Ideal para Campanhas Online
              - Pronta para Telemóvel
              - Design Focado em Resultados
              - Atendimento Personalizado
              - Mais Contactos e Vendas
              - Empresa em Braga
            descriptions:
              - Landing pages rápidas e focadas em conversão para as suas campanhas de anúncios.
              - Transforme visitas em contactos com uma página feita para vender. Peça o seu orçamento.
              - Design moderno, texto persuasivo e pronta para o telemóvel. Fale connosco hoje.
              - Atendimento personalizado em Portugal. Do planeamento à publicação da sua página.
